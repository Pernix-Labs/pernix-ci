name: test-secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (secret-scan)
        run: python3 -I -m unittest discover -s tests/unit/secret-scan -v
      - name: Unit tests (_shared)
        run: python3 -I -m unittest discover -s tests/unit/_shared -v

  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pass: this repo's event range.
      - id: own
        uses: ./actions/secret-scan
      - name: Assert own range clean
        env:
          COUNT: ${{ steps.own.outputs.findings-count }}
        run: |
          [[ "$COUNT" == "0" ]] || { echo "::error::expected findings-count 0, got '$COUNT'"; exit 1; }

      # Fail: temp repo with a runtime-generated token, full history.
      - name: Build leaky repo
        run: tests/fixtures/secret-scan/make-repo.sh "$RUNNER_TEMP/leaky"
      - id: leaky
        uses: ./actions/secret-scan
        continue-on-error: true
        with:
          scan-mode: full-history
          working-directory: ${{ runner.temp }}/leaky
      - name: Assert leaky repo failed
        env:
          OUTCOME: ${{ steps.leaky.outcome }}
          COUNT: ${{ steps.leaky.outputs.findings-count }}
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "::error::expected failure, got '$OUTCOME'"; exit 1; }
          [[ "$COUNT" =~ ^[0-9]+$ && "$COUNT" -gt 0 ]] || { echo "::error::expected findings-count > 0, got '$COUNT'"; exit 1; }

      # Pass: same token allowlisted via .gitleaksignore fingerprint.
      - name: Build allowlisted repo
        run: tests/fixtures/secret-scan/make-repo.sh "$RUNNER_TEMP/allowlisted" --allowlist
      - id: allowlisted
        uses: ./actions/secret-scan
        with:
          scan-mode: full-history
          working-directory: ${{ runner.temp }}/allowlisted
      - name: Assert allowlisted repo clean
        env:
          COUNT: ${{ steps.allowlisted.outputs.findings-count }}
        run: |
          [[ "$COUNT" == "0" ]] || { echo "::error::expected findings-count 0, got '$COUNT'"; exit 1; }

      # Fail: depth-1 clone with a push-style before..sha range.
      - name: Build shallow clone
        run: |
          src="$RUNNER_TEMP/shallow-src"
          tests/fixtures/secret-scan/make-repo.sh "$src" --allowlist
          git -C "$src" -c user.name=fixture -c user.email=fixture@example.invalid \
            commit -q --allow-empty -m "second commit"
          git clone -q --depth 1 "file://$src" "$RUNNER_TEMP/shallow"
          printf '{"before":"%s"}\n' "$(git -C "$src" rev-parse HEAD~1)" >"$RUNNER_TEMP/push-event.json"
          echo "SHALLOW_SHA=$(git -C "$src" rev-parse HEAD)" >>"$GITHUB_ENV"
      - id: shallow
        name: Run scan.sh on shallow clone with push event
        continue-on-error: true
        shell: bash
        run: |
          env GITHUB_EVENT_NAME=push \
            GITHUB_EVENT_PATH="$RUNNER_TEMP/push-event.json" \
            GITHUB_SHA="$SHALLOW_SHA" \
            INPUT_SCAN_MODE=auto \
            INPUT_CONFIG_PATH= \
            INPUT_WORKING_DIRECTORY="$RUNNER_TEMP/shallow" \
            actions/secret-scan/scan.sh | tee "$RUNNER_TEMP/shallow.log"
      - name: Assert shallow clone failed with fetch-depth hint
        env:
          OUTCOME: ${{ steps.shallow.outcome }}
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "::error::expected failure, got '$OUTCOME'"; exit 1; }
          grep -q 'fetch-depth: 0' "$RUNNER_TEMP/shallow.log" || { echo "::error::missing fetch-depth hint"; exit 1; }
