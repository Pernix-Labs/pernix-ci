name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and actionlint
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"

          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$dl/$sc" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$sc"
          echo "${SHELLCHECK_SHA256}  $dl/$sc" | sha256sum -c -
          tar -xJf "$dl/$sc" -C "$dl"
          install -m 0755 "$dl/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/shellcheck"

          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$dl/$al" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$al"
          echo "${ACTIONLINT_SHA256}  $dl/$al" | sha256sum -c -
          tar -xzf "$dl/$al" -C "$dl" actionlint
          install -m 0755 "$dl/actionlint" "$bin/actionlint"

          echo "$bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Check actions/_shared usage
        run: .github/scripts/check-shared-usage.sh
