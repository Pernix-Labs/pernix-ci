name: secret-scan
description: Scan git history or the event commit range for secrets with gitleaks. Fails on any finding.

inputs:
  scan-mode:
    description: "`auto` scans the event commit range. `full-history` scans all history."
    required: false
    default: auto
  config-path:
    description: Path to a gitleaks config file, relative to `working-directory`. Empty uses `<working-directory>/.gitleaks.toml` when present, else the gitleaks default rules.
    required: false
    default: ""
  working-directory:
    description: Root of the git repository to scan.
    required: false
    default: .

outputs:
  findings-count:
    description: Number of gitleaks findings.
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_SCAN_MODE: ${{ inputs.scan-mode }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: '"${{ github.action_path }}/scan.sh"'
