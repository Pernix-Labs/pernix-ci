name: image-build-push
description: Build and push <image>:sha-<sha> to GHCR with OCI labels, build args, and GitHub Actions layer cache.

inputs:
  image:
    description: Full image name without tag, ghcr.io only (e.g. ghcr.io/pernix-labs/foo).
    required: true
  context:
    description: Build context directory.
    required: false
    default: .
  dockerfile:
    description: Path to the Dockerfile. Empty means <context>/Dockerfile.
    required: false
    default: ""
  sha:
    description: Full 40-char commit sha. Image is tagged sha-<sha>.
    required: false
    default: ${{ github.sha }}
  version:
    description: SemVer 2.0 version for BUILD_VERSION and the version label. Empty means 0.0.0-sha.<short sha>.
    required: false
    default: ""
  build-args:
    description: Extra build args, newline-separated KEY=VALUE. BUILD_VERSION and BUILD_COMMIT always override.
    required: false
    default: ""
  platforms:
    description: Comma-separated target platforms.
    required: false
    default: linux/amd64
  cache:
    description: Use the GitHub Actions layer cache scoped per image (true|false).
    required: false
    default: "true"
  source-url:
    description: Repository URL for the org.opencontainers.image.source label.
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  registry-token:
    description: Token for ghcr.io login.
    required: false
    default: ${{ github.token }}
  registry-username:
    description: Username for ghcr.io login.
    required: false
    default: ${{ github.actor }}

outputs:
  image:
    description: Image name without tag.
    value: ${{ steps.outputs.outputs.image }}
  tag:
    description: Pushed tag, sha-<sha>.
    value: ${{ steps.outputs.outputs.tag }}
  digest:
    description: Manifest digest, sha256:<64hex>.
    value: ${{ steps.outputs.outputs.digest }}
  ref:
    description: Immutable reference, <image>@<digest>.
    value: ${{ steps.outputs.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Prepare
      id: prepare
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        SHA: ${{ inputs.sha }}
        VERSION: ${{ inputs.version }}
        BUILD_ARGS: ${{ inputs.build-args }}
        PLATFORMS: ${{ inputs.platforms }}
        CACHE: ${{ inputs.cache }}
        SOURCE_URL: ${{ inputs.source-url }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
      run: '"$GITHUB_ACTION_PATH/image-build-push.sh" prepare'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ${{ inputs.context }}
        file: ${{ steps.prepare.outputs.dockerfile }}
        push: true
        tags: ${{ steps.prepare.outputs.tags }}
        labels: ${{ steps.prepare.outputs.labels }}
        build-args: ${{ steps.prepare.outputs.build-args }}
        platforms: ${{ inputs.platforms }}
        cache-from: ${{ steps.prepare.outputs.cache-from }}
        cache-to: ${{ steps.prepare.outputs.cache-to }}
        provenance: false
        sbom: false

    - name: Outputs
      id: outputs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ steps.prepare.outputs.tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: '"$GITHUB_ACTION_PATH/image-build-push.sh" outputs'
