name: dotnet-restore
description: Restore the caller's .NET solution or project with a cached NuGet global packages folder.

inputs:
  working-directory:
    description: Directory that holds the solution or project.
    required: false
    default: .
  project:
    description: Solution or project path relative to working-directory. Empty means auto-detect (one *.slnx, else one *.sln, else one *.csproj).
    required: false
    default: ""
  locked-mode:
    description: Pass --locked-mode so restore fails when packages.lock.json is out of date.
    required: false
    default: "false"

outputs:
  project:
    description: Resolved solution or project path, relative to working-directory.
    value: ${{ steps.restore.outputs.project }}
  cache-hit:
    description: "'true' when the NuGet cache key matched exactly."
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # hashFiles rejects '.' and '..' segments, so '.', './x' and 'repo/.'
    # become a plain glob prefix ('' or 'x/') first.
    - id: glob
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        prefix="$(python3 -I "$GITHUB_ACTION_PATH/../_shared/wdpath.py" glob "$INPUT_WORKING_DIRECTORY")"
        echo "prefix=${prefix}" >>"$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles(format('{0}**/Directory.Packages.props', steps.glob.outputs.prefix), format('{0}**/*.csproj', steps.glob.outputs.prefix), format('{0}**/packages.lock.json', steps.glob.outputs.prefix), format('{0}**/global.json', steps.glob.outputs.prefix), format('{0}**/nuget.config', steps.glob.outputs.prefix), format('{0}**/NuGet.Config', steps.glob.outputs.prefix)) }}
        restore-keys: nuget-${{ runner.os }}-

    - id: restore
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_LOCKED_MODE: ${{ inputs.locked-mode }}
      run: '"${{ github.action_path }}/restore.sh"'
